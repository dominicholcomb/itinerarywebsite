<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipboard Drawer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <label>
      Color
      <input type="color" id="colorPicker" value="#111111">
    </label>

    <label>
      Brush size
      <input type="range" id="brushSize" min="1" max="60" value="6">
      <span id="brushSizeLabel">6</span>
    </label>

    <button id="eraserBtn" type="button">Eraser</button>
    <button id="undoBtn" type="button">Undo</button>
    <button id="clearBtn" type="button">Clear</button>
    <button id="saveBtn" type="button">Save Drawing</button>
  </div>

  <div id="canvasWrap">
    <canvas id="cardCanvas"></canvas>
  </div>

  <p id="hint">The outline shows the clipboard board plus the clip at the top. Draw with your mouse or trackpad. When you're happy with it, click "Save Drawing" — that downloads a PNG (for the picture) and a JSON file (the raw strokes). Send both files back to me.</p>

  <script src="script.js"></script>
</body>
</html>
